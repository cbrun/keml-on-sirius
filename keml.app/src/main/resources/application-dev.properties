# Matches the PostgreSQL service in keml.releng/docker-compose.yml.
# Port 5434 and a separate database avoid sharing Guesstimate's development data.
spring.datasource.url=jdbc:postgresql://localhost:5434/keml-db
spring.datasource.username=keml
spring.datasource.password=keml

# Local-only diagnostics; the default profile keeps normal INFO logging.
logging.level.org.eclipse.sirius.web=DEBUG
# Allows local SVG export without an external referer, as in Guesstimate's dev profile.
sirius.components.imageRegistry.referer.enabled=false
