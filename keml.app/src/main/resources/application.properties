# The server serves the Sirius Web frontend and GraphQL API from the same origin.
spring.application.name=keml
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# The starter contains the database schema and migrations; do not copy its changelog here.
spring.liquibase.change-log=classpath:db/db.changelog-master.xml

# Elasticsearch is optional in Sirius Web. This sample searches the loaded model
# without an Elasticsearch server, so exclude that optional service from health checks.
# Re-enable this indicator when configuring Elasticsearch in your own application.
management.health.elasticsearch.enabled=false

# This app edits KEML models using its Java-defined view. Hide the Studio authoring
# templates from end users; they are for building modeling tools inside Sirius Web.
# Keep the optional portal disabled as in Guesstimate.
sirius.web.enabled=*
sirius.web.disabled=portal,studio

# Allow uploading model documents. Spring also limits the total multipart request size.
spring.servlet.multipart.max-file-size=256MB
spring.servlet.multipart.max-request-size=256MB

# Database settings come from the dev profile or SPRING_DATASOURCE_* environment variables.
# Keep the packaged frontend on the same origin; a separate frontend needs explicit CORS settings.
