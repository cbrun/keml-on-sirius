name: keml
services:
  database:
    image: postgres:17
    ports:
      - '${KEML_DATABASE_PORT:-5434}:5432'
    environment:
      # Sample credentials for local development; override them for another environment.
      POSTGRES_DB: keml-db
      POSTGRES_USER: keml
      POSTGRES_PASSWORD: '${KEML_DATABASE_PASSWORD:-keml}'
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keml -d keml-db']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ../keml.app
      dockerfile: ../keml.releng/Dockerfile
    ports:
      - '${KEML_HTTP_PORT:-8080}:8080'
    environment:
      # Inside Docker, use the Compose service name and container port, not localhost:5434.
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/keml-db
      SPRING_DATASOURCE_USERNAME: keml
      SPRING_DATASOURCE_PASSWORD: '${KEML_DATABASE_PASSWORD:-keml}'
    depends_on:
      database:
        condition: service_healthy
volumes:
  database-data:
